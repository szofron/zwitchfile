<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ศูนย์ควบคุมคิวผู้ป่วยนอก (สาธิต)</title>
<meta name="description" content="ระบบสาธิตแสดงคิวและความหนาแน่นผู้ป่วยนอกแบบ 3 มิติ — ข้อมูลจำลองเพื่อการสาธิต">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231e9fb3'/%3E%3Cpath d='M32 14v36M14 32h36' stroke='white' stroke-width='9' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<style>
:root{
  --bg:#e9f1f0; --card:#ffffff; --ink:#1d2b38; --muted:#64768a; --line:#e3eaee;
  --teal:#1e9fb3; --teal-d:#12788a; --teal-l:#e0f4f7;
  --green:#1f9d63; --green-bg:#e3f6ec; --yellow:#a87400; --yellow-bg:#fff4cf; --red:#d12f37; --red-bg:#fde6e7;
  --shadow:0 6px 22px rgba(30,60,80,.13), 0 1px 3px rgba(30,60,80,.08);
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ color-scheme:light; } }
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:'Noto Sans Thai','Sarabun','Leelawadee UI','Tahoma',system-ui,sans-serif;font-size:14px;line-height:1.4}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
#stage{position:fixed;inset:0}
#stage canvas{display:block}
#stage .css2d{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#ui{position:fixed;inset:0;pointer-events:none;z-index:10}
#ui .card,#ui .pt{pointer-events:auto}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* persistent simulated-data badge */
#badge{position:fixed;top:8px;right:10px;z-index:1000;background:#fff7d6;color:#7a5600;border:1.5px solid #f2c230;
  border-radius:999px;padding:4px 12px;font-weight:600;font-size:12.5px;box-shadow:var(--shadow);pointer-events:none;white-space:nowrap}
#badge::before{content:"⚠ "}

/* ---------- command layout ---------- */
.col-l{position:absolute;left:12px;top:12px;width:392px;max-width:calc(100vw - 24px);max-height:calc(100vh - 215px);overflow:auto;display:flex;flex-direction:column;gap:10px;padding-bottom:4px;scrollbar-width:thin}
.col-r{position:absolute;right:12px;top:44px;width:318px;max-height:calc(100vh - 60px);overflow:auto;display:flex;flex-direction:column;gap:10px;scrollbar-width:thin}
.title{display:flex;align-items:center;gap:10px}
.title .logo{width:34px;height:34px;border-radius:10px;background:var(--teal);display:grid;place-items:center;color:#fff;font-weight:700;font-size:20px;flex:none}
.title h1{font-size:16px;margin:0;line-height:1.2}
.title small{color:var(--muted);font-size:11.5px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pill{border:1px solid var(--line);background:#f5f9fa;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:500}
.pill:hover{background:var(--teal-l)}
.pill[aria-pressed="true"],.pill.on{background:var(--teal);border-color:var(--teal);color:#fff}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row.sp{justify-content:space-between}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-weight:600;font-size:12.5px}
.chip.live{background:var(--red-bg);color:var(--red)}
.chip.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--red);animation:blink 1.4s infinite}
.chip.replay{background:var(--teal-l);color:var(--teal-d)}
.chip.closed{background:#eceff2;color:#59697a}
@keyframes blink{50%{opacity:.25}}
.reduce *{animation:none!important}
select,input[type=text]{border:1px solid #cfdbe1;border-radius:9px;background:#fff;padding:5px 8px;min-width:0}
.btn{border:0;border-radius:9px;background:var(--teal);color:#fff;font-weight:600;padding:6px 14px}
.btn:hover{background:var(--teal-d)}
.btn.ghost{background:#eef4f6;color:var(--ink)}
.btn.ghost:hover{background:var(--teal-l)}
.btn.sm{padding:3px 10px;font-size:12.5px}
.speeds{display:flex;gap:4px}
.speeds .btn{padding:3px 9px;font-size:12.5px}
.speeds .btn.on{background:var(--teal);color:#fff}
.slider{display:block;width:100%;accent-color:var(--teal);margin:2px 0 0}
.spark{width:100%;height:34px;display:block}
.clock{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--teal-d)}
.muted{color:var(--muted)}
.fine{font-size:12px}

/* levels */
.lv{display:inline-flex;align-items:center;gap:5px;border-radius:7px;padding:1px 8px;font-weight:600;font-size:12.5px;white-space:nowrap}
.lv.green{background:var(--green-bg);color:var(--green)}
.lv.yellow{background:var(--yellow-bg);color:var(--yellow)}
.lv.red{background:var(--red-bg);color:var(--red)}

/* kpi */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:#f5f9fa;border-radius:10px;padding:7px 9px}
.kpi b{display:block;font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
.kpi.red b{color:var(--red)}
.bars{display:flex;flex-direction:column;gap:5px;margin-top:6px}
.bar{display:grid;grid-template-columns:104px 1fr 38px;gap:6px;align-items:center;font-size:12px}
.bar i{display:block;height:8px;border-radius:5px;background:var(--teal);min-width:2px}
.bar em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
h3{margin:0 0 6px;font-size:13.5px}
.alert{border-left:5px solid var(--red);background:var(--red-bg);border-radius:9px;padding:6px 9px;margin-top:6px;cursor:pointer}
.alert b{color:var(--red)}
.alert.warn{border-color:#f2b705;background:var(--yellow-bg)}
.alert.warn b{color:var(--yellow)}
.sugg{border-left:5px solid var(--teal);background:var(--teal-l);border-radius:9px;padding:6px 9px;margin-top:6px;font-size:13px}
.empty{color:var(--muted);font-size:12.5px;padding:2px 0}

/* detail */
table.tb{width:100%;border-collapse:collapse;font-size:12.5px}
table.tb th{font-weight:500;color:var(--muted);text-align:right;padding:2px 4px}
table.tb th:first-child,table.tb td:first-child{text-align:left}
table.tb td{padding:3px 4px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}

/* legend */
.legend{position:absolute;left:12px;bottom:12px;width:min(520px,calc(100vw - 24px))}
.legend .items{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;margin-top:6px}
.legend .ring{display:inline-block;width:12px;height:12px;border-radius:50%;border:2.5px solid var(--red);vertical-align:-2px;margin-right:4px}

/* off-hours */
.offhours{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);text-align:center;max-width:min(420px,90vw)}
.offhours h2{margin:0 0 4px;font-size:24px}

/* 3D labels */
.lbl{background:rgba(255,255,255,.94);border:1.5px solid #bfe3ea;border-radius:10px;padding:2px 9px;font-weight:600;font-size:12px;white-space:nowrap;
  box-shadow:0 3px 10px rgba(30,60,80,.18);display:flex;gap:6px;align-items:center;pointer-events:none;transform:translateY(-4px)}
.lbl .n{background:var(--teal);color:#fff;border-radius:7px;padding:0 6px;font-variant-numeric:tabular-nums}
.lbl.clinic{pointer-events:auto;cursor:pointer;font-size:13px}
.lbl.svc{font-size:11px;font-weight:500;padding:1px 7px;background:rgba(255,255,255,.88)}
.lbl.bld{background:var(--teal);color:#fff;border-color:var(--teal-d);font-size:15px}
.lbl.green{border-color:#8fd7b2}.lbl.yellow{border-color:#f2c230;background:#fffbe8}
.lbl.red{border-color:var(--red);background:#fff1f1;color:var(--red)}
.lbl.red .n{background:var(--red)} .lbl.yellow .n{background:#c78d00}
.lbl .ic{font-size:11px}

/* debug */
#debug{position:absolute;left:560px;right:12px;bottom:12px;font-size:12px}
#debug .row{margin-top:4px}
#fps{font-weight:700}

/* ---------- TV ---------- */
.mode-tv{font-size:32px}
.mode-tv #badge{font-size:32px;top:10px;right:14px;padding:4px 22px}
.mode-tv .lbl{font-size:32px;padding:4px 16px;border-radius:14px}
.mode-tv .lbl .n{padding:0 10px}
.tv-head{position:absolute;left:24px;top:20px;max-width:46vw;pointer-events:none}
.tv-head .card{padding:14px 26px}
.tv-head h1{font-size:44px;margin:0;line-height:1.15}
.tv-head .sub{font-size:32px;color:var(--muted)}
.tv-head .lv{font-size:32px;padding:2px 16px;border-radius:12px;margin-top:6px}
.tv-board{position:absolute;right:24px;top:96px;width:min(520px,36vw);pointer-events:none}
.tv-board .card{padding:14px 22px}
.tv-board .r{display:flex;justify-content:space-between;align-items:baseline;gap:16px;font-size:32px}
.tv-board .r b{font-size:40px;font-variant-numeric:tabular-nums}
.tv-ticker{position:absolute;left:0;right:0;bottom:0;height:78px;background:var(--teal-d);color:#fff;overflow:hidden;display:flex;align-items:center;font-size:36px;font-weight:600;pointer-events:none}
.tv-ticker .tag{background:#0c4f5c;height:100%;display:flex;align-items:center;padding:0 28px;z-index:2;white-space:nowrap;font-size:32px}
.tv-ticker .track{white-space:nowrap;position:absolute;left:0;padding-left:100%;animation:tick var(--tickdur,60s) linear infinite}
.tv-ticker .track span{margin-right:80px}
@keyframes tick{to{transform:translateX(-100%)}}
.reduce .tv-ticker .track{padding-left:200px;position:absolute}
.mode-tv,.mode-tv *{pointer-events:none!important;cursor:none}
.mode-tv #debug,.mode-tv #debug *{pointer-events:auto!important;cursor:auto}
.tv-closed{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);text-align:center}
.tv-closed .card{padding:24px 44px}

/* ---------- mobile ---------- */
.mode-mobile #stage{position:relative;inset:auto;height:210px;border-radius:var(--r);overflow:hidden;margin-top:10px;box-shadow:var(--shadow)}
.mobile{position:absolute;inset:0;overflow:auto;padding:46px 12px 18px;pointer-events:none;background:linear-gradient(#e9f1f0,#f6fafa)}
.mobile>*{pointer-events:auto;max-width:560px;margin-left:auto;margin-right:auto}
.mobile h1{font-size:18px;margin:0 0 2px}
.mobile .q{display:flex;gap:8px;margin-top:8px}
.mobile .q input{flex:1;font-size:18px;text-transform:uppercase;padding:9px 10px;letter-spacing:.5px}
.mobile .big{font-size:34px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.mobile .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.mobile .stat{background:#f5f9fa;border-radius:12px;padding:10px}
.mobile .stat span{font-size:12px;color:var(--muted)}
.mobile .steps{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
.mobile .step{font-size:11.5px;border-radius:7px;padding:2px 7px;background:#eceff2;color:#59697a}
.mobile .step.now{background:var(--teal);color:#fff;font-weight:600}
.mobile .step.done{background:var(--green-bg);color:var(--green)}
.samples{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.err{color:var(--red);font-weight:600;margin-top:8px}

@media (max-width:900px){
  .lbl.svc{display:none}.lbl.clinic{font-size:10px;padding:0 5px}.lbl.bld{font-size:11px}
  .offhours{position:static;transform:none;margin:12px;max-width:none}
  #debug{left:12px;transform:none;width:auto;right:12px;bottom:60px;position:fixed}
  .col-r{position:static;width:auto;max-height:none;margin:0 12px}
  .col-l{width:auto;right:12px;max-height:none}
  #ui.cmd{overflow:auto;pointer-events:auto}
  .col-l{position:static;margin:12px;max-height:none}
  .legend{position:static;margin:12px;width:auto}
  #stage{height:46vh;bottom:auto}
  #ui.cmd .wrap{position:relative;margin-top:calc(46vh - 6px);padding-bottom:20px;background:var(--bg)}
}
</style>
</head>
<body>
<div id="stage"></div>
<div id="ui"></div>
<div id="badge" role="status"></div>
<script type="module">
/*
 * ศูนย์ควบคุมคิวผู้ป่วยนอก — DEMO (single file, no build step)
 * ============================================================================
 * ASSUMPTIONS (decided without asking; change in CONFIG if needed)
 *  - ALL DATA IS SIMULATED. No real hospital statistics are used or implied.
 *  - Seed = date string "YYYY-MM-DD" (Gregorian ISO); the UI shows พ.ศ. (Buddhist Era).
 *  - Clinic -> building assignment is a placeholder: OPD1 = MED, PSY, OBG; OPD2 = SUR, ORT, PED; OPD3 = ENT, DEN, EYE.
 *  - Per-clinic stages: registration/screening, vitals, doctor (wait + consult). Lab/X-ray, cashier and pharmacy
 *    are shared per-building services (a clinic's patients queue there, service time comes from the clinic's CONFIG).
 *  - Density levels for a clinic = worst of its own 3 waiting areas (reg / vitals / wait-for-doctor).
 *    Shared services (lab, cashier, pharmacy lanes) and ER have their own level and alerts.
 *  - Pharmacy: patients sit in the pharmacy waiting area while medication is prepared, so for the pharmacy
 *    stage "waiting" = queued + being dispensed (wait minutes counted from arrival at pharmacy).
 *    "Home delivery" lane service time is a short counter visit (CONFIG.homeSvc), default 20% of patients with meds.
 *  - Servers for pharmacy are "dispensing stations" (parallel pharmacists/robots), not physical windows.
 *  - Default pctHomeDelivery is applied to patients who receive medication (after removing the no-medication share).
 *  - Walking time is not part of the discrete-event model; agents glide between zones in the renderer.
 *  - Weekends/holidays are not modelled: every date yields a normal weekday volume (+/-4%).
 *  - Ring under feet: patient waiting longer than CONFIG.ringWaitMin (default 45 min).
 *  - Live mode outside 07:00–17:00 (Asia/Bangkok) shows "นอกเวลาทำการ"; the offer button replays yesterday.
 *  - Default replay speed after picking a date: x30.  TV/mobile accept ?date=YYYY-MM-DD&t=HH:MM for replay demos.
 *  - The file lives at opd-queue/index.html so the repository's existing root index.html is not overwritten.
 * ============================================================================
 * URL PARAMS:  ?mode=command|tv|mobile   ?debug=1   ?date=YYYY-MM-DD   ?t=HH:MM   ?layout=url-to-layout.json
 */
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

// ===== 1. CONFIG =====
const SVC_DEFAULT = {            // minutes: m = mean, sd = standard deviation (truncated normal)
  reg:      { m: 2.5, sd: 0.5 },
  vitals:   { m: 4,   sd: 0.8 },
  doctor:   { m: 11.5, sd: 2.5 },
  lab:      { m: 15,  sd: 3 },
  cashier:  { m: 3,   sd: 0.6 },
  pharm:    { m: 15,  sd: 3 },
};
const CONFIG = {
  tz: 'Asia/Bangkok', tzOffsetMin: 420,
  hours: { open: 7 * 60, arrivalClose: 16 * 60, end: 17 * 60 },     // minutes after midnight
  visitsPerDay: 3000, volumeJitter: 0.04,
  // arrival density = flat base + gaussian peaks (minutes after midnight)
  arrival: { base: 0.12, peaks: [{ w: 0.60, mu: 555, sd: 48 }, { w: 0.28, mu: 810, sd: 28 }] },
  routing: { pctLab: 0.20, pctNoMeds: 0.12, pctHomeDelivery: 0.20 },
  homeSvc: { m: 4, sd: 1 },                                             // home-delivery lane counter time
  seatedDuringService: { pharm: true },                                 // patients stay seated while being served
  maxRenderAgents: 500,
  ringWaitMin: 45,
  thresholds: {
    occ:  { yellow: 0.60, red: 0.85 },       // occupancy = waiting / seats
    wait: { yellow: 30,   red: 60 },         // minutes
    minSample: 3,                            // wait-based level needs >= N waiting people
    hysteresisMin: 3,                        // sim-minutes a new level must persist before it is shown
    resetGapMin: 8,                          // time jump (sim-min) that resets hysteresis (scrubbing)
  },
  // rule-based suggestions (Command Center only). No generated text.
  //   scope 'clinic': stage 'clinic' = clinic overall level, or a unit stage ('vitals','reg','doctor')
  //   scope 'service': stage in lab|cashier|pharm|pharm_home (per building)
  //   trigger: level (+ minMinutes persisted) and/or avgWaitOver (minutes)
  rules: [
    { id: 'spareRoom',    scope: 'clinic',  stage: 'clinic',  level: 'red', minMinutes: 10, textKey: 'ruleSpareRoom' },
    { id: 'extraVitals',  scope: 'clinic',  stage: 'vitals',  level: 'red', minMinutes: 0,  textKey: 'ruleExtraVitals' },
    { id: 'homeDelivery', scope: 'service', stage: 'pharm',   avgWaitOver: 45,             textKey: 'ruleHomeDelivery' },
    { id: 'extraCashier', scope: 'service', stage: 'cashier', level: 'red', minMinutes: 5, textKey: 'ruleExtraCashier' },
    { id: 'extraLab',     scope: 'service', stage: 'lab',     level: 'red', minMinutes: 5, textKey: 'ruleExtraLab' },
  ],
  tour: { intervalSec: 12 },
  ui: { snapshotMs: 220, defaultReplaySpeed: 30, speeds: [1, 10, 30, 60] },
  colors: {
    stage: { reg: '#f28c38', vitals: '#9b6bd6', wait: '#f2c230', consult: '#e0559a', lab: '#3b82f6', cashier: '#84b73a', pharm: '#14b8a6', er: '#94a3b8' },
    wait:  { green: '#2eb872', yellow: '#f2b705', red: '#e5484d' },
    ring: '#e5484d', chair: ['#2fa6b8', '#3a8fc9'],
    zone: { reg: '#fbe4e8', vitals: '#fde9ee', wait: '#f9d9df', lab: '#dff0f7', cashier: '#e8f3df', pharm: '#e2f4ee', pharm_home: '#eaf1fb', er_wait: '#fbd5d5', er: '#fdeaea', consult: '#fffdf8', entrance: '#e7f6ee', exit: '#e7f6ee' },
    floor: '#f7f9fa', wall: '#ffffff', ground: '#dfe9e5', desk: '#bcd6dd',
  },
  buildings: [
    { id: 'OPD1', nameTh: 'อาคาร OPD1', shared: { lab: { servers: 13, seats: 36 }, cashier: { servers: 13, seats: 40 }, pharm: { servers: 34, seats: 100 }, pharm_home: { servers: 3, seats: 14 } } },
    { id: 'OPD2', nameTh: 'อาคาร OPD2', shared: { lab: { servers: 11, seats: 36 }, cashier: { servers: 11, seats: 40 }, pharm: { servers: 26, seats: 100 }, pharm_home: { servers: 3, seats: 14 } } },
    { id: 'OPD3', nameTh: 'อาคาร OPD3', shared: { lab: { servers: 9,  seats: 36 }, cashier: { servers: 10, seats: 40 }, pharm: { servers: 22, seats: 100 }, pharm_home: { servers: 3, seats: 14 } } },
  ],
  clinics: [
    { id: 'MED', nameTh: 'อายุรกรรม',              building: 'OPD1', share: 0.27, rooms: 26, seats: { reg: 36, vitals: 36, wait: 110 }, servers: { reg: 9, vitals: 14 }, svc: { doctor: { m: 11, sd: 3 } } },
    { id: 'PSY', nameTh: 'จิตเวช',                 building: 'OPD1', share: 0.05, rooms: 9,  seats: { reg: 18, vitals: 20, wait: 40 }, servers: { reg: 3, vitals: 3 }, svc: { doctor: { m: 18, sd: 4 }, lab: { m: 12, sd: 3 } } },
    { id: 'OBG', nameTh: 'สูติ-นรีเวชกรรม',        building: 'OPD1', share: 0.09, rooms: 10, seats: { reg: 18, vitals: 20, wait: 50 }, servers: { reg: 4, vitals: 5 }, svc: { doctor: { m: 12, sd: 3 }, lab: { m: 18, sd: 3 } } },
    { id: 'SUR', nameTh: 'ศัลยกรรม',               building: 'OPD2', share: 0.11, rooms: 10, seats: { reg: 18, vitals: 20, wait: 50 }, servers: { reg: 4, vitals: 5 }, svc: { doctor: { m: 10, sd: 3 } } },
    { id: 'ORT', nameTh: 'ออร์โธปิดิกส์',          building: 'OPD2', share: 0.11, rooms: 10, seats: { reg: 18, vitals: 20, wait: 50 }, servers: { reg: 4, vitals: 5 }, svc: { doctor: { m: 10, sd: 2.5 }, lab: { m: 17, sd: 3 } }, pctLab: 0.45 },
    { id: 'PED', nameTh: 'กุมารเวชกรรม',           building: 'OPD2', share: 0.10, rooms: 10, seats: { reg: 18, vitals: 20, wait: 50 }, servers: { reg: 4, vitals: 5 }, svc: { doctor: { m: 9, sd: 2.5 } } },
    { id: 'ENT', nameTh: 'โสต ศอ นาสิก',           building: 'OPD3', share: 0.08, rooms: 8,  seats: { reg: 18, vitals: 20, wait: 42 }, servers: { reg: 3, vitals: 4 }, svc: { doctor: { m: 8, sd: 2 } } },
    { id: 'DEN', nameTh: 'ทันตกรรม',              building: 'OPD3', share: 0.11, rooms: 18, seats: { reg: 18, vitals: 20, wait: 56 }, servers: { reg: 4, vitals: 4 }, svc: { doctor: { m: 14, sd: 3 } }, pctLab: 0.05 },

/*
 * LAYOUT JSON SCHEMA (all lengths in metres; +x = right, +z = towards the viewer / building front)
 * {
 *   schema: 1,
 *   buildings: [ { id:'OPD1', nameTh:'อาคาร OPD1', x, z, w, d } ],   // floor plate: world centre (x,z), width (x) and depth (z)
 *   rooms: [ {
 *     id:'MED-W',            // unique
 *     type:'reg'|'vitals'|'wait'|'consult'|'lab'|'cashier'|'pharm'|'pharm_home'|'er_wait'|'er'|'entrance'|'exit',
 *     building:'OPD1',       // which plate
 *     clinicId:'MED'|null,   // required for reg / vitals / wait / consult
 *     x, z, w, d,            // centre of the room RELATIVE TO ITS BUILDING CENTRE, and size
 *     seats: 40,             // waiting chairs (reg / vitals / wait / lab / cashier / pharm / pharm_home / er_wait)
 *     servers: 3,            // service points: counters (reg, vitals, lab, cashier, pharm, pharm_home), beds (er),
 *                            // consult rooms count 1 each (put one `consult` room per exam room)
 *     edge: 'N'|'S',         // side of the counter strip (N = min z). Chairs fill away from this edge
 *     label: 'ลงทะเบียน'     // optional floating label
 *   } ],
 *   props: [ { type:'tree', building, x, z, s } ]                       // decoration (s = scale)
 * }
 * Seats / servers from the layout drive both the simulation capacity and the occupancy metric. Service minutes,
 * volumes and clinic names stay in CONFIG. Load a real plan with  ?layout=https://.../layout.json
 */
function buildPlaceholderLayout(cfg) {
  const L = { schema: 1, buildings: [], rooms: [], props: [] };
  const PX = 0.95, PZ = 1.1;
  const colsFor = w => Math.max(1, Math.floor((w - 1) / PX));
  const zoneDepth = (seats, w) => Math.max(5, 2.4 + Math.ceil(seats / colsFor(w)) * PZ);
  let zCursor = null, maxW = 0, firstZ = 0;
  const GAP = 16;
  for (const b of cfg.buildings) {
    const clinics = cfg.clinics.filter(c => c.building === b.id);
    const info = clinics.map(c => { const rows = Math.ceil(c.rooms / 8), per = Math.ceil(c.rooms / rows); return { c, rows, per, w: Math.max(14, per * 2.8 + 1) }; });
    const gapX = 1.5;
    const W = Math.max(info.reduce((s, i) => s + i.w + gapX, gapX) + 2, 72);
    const consultD = 4 * Math.max(...info.map(i => i.rows));
    const waitD = Math.max(...info.map(i => zoneDepth(i.c.seats.wait, i.w - 1)));
    const vitD = Math.max(...info.map(i => zoneDepth(i.c.seats.vitals, i.w - 1)));
    const regD = Math.max(...info.map(i => zoneDepth(i.c.seats.reg, i.w - 1)));
    const sw = { lab: 12, cashier: 12, pharm: 18, pharm_home: 10 };
    const svcD = Math.max(...Object.keys(sw).map(k => zoneDepth(b.shared[k].seats, sw[k])));
    const D = 1.5 + consultD + 0.4 + waitD + 0.4 + vitD + 0.4 + regD + 3 + svcD + 4.5;
    const bz = zCursor === null ? 0 : zCursor + D / 2;
    if (zCursor === null) firstZ = 0;
    zCursor = bz + D / 2 + GAP;
    maxW = Math.max(maxW, W);
    L.buildings.push({ id: b.id, nameTh: b.nameTh, x: 0, z: bz, w: W, d: D });
    const zTop = -D / 2 + 1.5;
    const zWait = zTop + consultD + 0.4, zVit = zWait + waitD + 0.4, zReg = zVit + vitD + 0.4, zSvc = zReg + regD + 3;
    let xl = -(info.reduce((s, i) => s + i.w + gapX, gapX)) / 2 + gapX;
    for (const i of info) {
      const c = i.c, cw = (i.w - 1) / i.per;
      for (let k = 0; k < c.rooms; k++) {
        const row = Math.floor(k / i.per), col = k % i.per;
        L.rooms.push({ id: `${c.id}-R${String(k + 1).padStart(2, '0')}`, type: 'consult', building: b.id, clinicId: c.id,
          x: xl + 0.5 + (col + 0.5) * cw, z: zTop + consultD - 2 - row * 4, w: cw - 0.25, d: 3.7, seats: 0, servers: 1, label: String(k + 1) });
      }
      const zone = (type, zs, d, seats, servers, label) => L.rooms.push({ id: `${c.id}-${type}`, type, building: b.id, clinicId: c.id,
        x: xl + i.w / 2, z: zs + d / 2, w: i.w - 1, d, seats, servers, edge: 'N', label });
      zone('wait', zWait, waitD, c.seats.wait, 0, 'รอพบแพทย์');
      zone('vitals', zVit, vitD, c.seats.vitals, c.servers.vitals, 'วัดสัญญาณชีพ');
      zone('reg', zReg, regD, c.seats.reg, c.servers.reg, 'ลงทะเบียน/คัดกรอง');
      xl += i.w + gapX;
    }
    const order = ['lab', 'cashier', 'pharm', 'pharm_home'], names = { lab: 'Lab / X-ray', cashier: 'การเงิน', pharm: 'รับยาที่ รพ.', pharm_home: 'ยาส่งบ้าน' };
    let sx = -(order.reduce((s, k) => s + sw[k] + 1.5, -1.5)) / 2;
    for (const k of order) {
      L.rooms.push({ id: `${b.id}-${k}`, type: k, building: b.id, clinicId: null, x: sx + sw[k] / 2, z: zSvc + svcD / 2, w: sw[k], d: svcD,
        seats: b.shared[k].seats, servers: b.shared[k].servers, edge: 'S', label: names[k] });
      sx += sw[k] + 1.5;
    }
    L.rooms.push({ id: `${b.id}-in`, type: 'entrance', building: b.id, clinicId: null, x: -W / 2 + 6, z: D / 2 - 1.6, w: 7, d: 2.4, seats: 0, servers: 0, label: 'ทางเข้า' });
    L.rooms.push({ id: `${b.id}-out`, type: 'exit', building: b.id, clinicId: null, x: W / 2 - 6, z: D / 2 - 1.6, w: 7, d: 2.4, seats: 0, servers: 0, label: 'ทางออก' });
    // trees (deterministic)
    for (let z = -D / 2 + 4; z < D / 2; z += 9) { L.props.push({ type: 'tree', building: b.id, x: -W / 2 - 3.2, z, s: 0.9 + ((z * 7) % 5) / 12 }); L.props.push({ type: 'tree', building: b.id, x: W / 2 + 3.2, z: z + 2.5, s: 1 + ((z * 3) % 4) / 12 }); }
    for (let x = -W / 2 + 14; x < W / 2 - 10; x += 14) L.props.push({ type: 'tree', building: b.id, x, z: D / 2 + 3.4, s: 1 });
  }
  // ER block: separate plate, beside the last OPD building
  const er = cfg.er, eW = 32, eD = 24, lastB = L.buildings[L.buildings.length - 1];
  L.buildings.push({ id: 'ER', nameTh: 'ห้องฉุกเฉิน (ER)', x: maxW / 2 + 12 + eW / 2, z: lastB.z + 4, w: eW, d: eD });
  L.rooms.push({ id: 'ER-beds', type: 'er', building: 'ER', clinicId: 'ER', x: 0, z: -eD / 2 + 1.5 + 4, w: eW - 4, d: 8, seats: 0, servers: er.beds, label: 'เตียงตรวจ ER' });
  L.rooms.push({ id: 'ER-wait', type: 'er_wait', building: 'ER', clinicId: 'ER', x: 0, z: -eD / 2 + 1.5 + 8.4 + 3, w: eW - 4, d: 6, seats: er.seats, servers: 0, edge: 'N', label: 'รอรับการรักษา' });
  L.rooms.push({ id: 'ER-in', type: 'entrance', building: 'ER', clinicId: null, x: -eW / 2 + 5, z: eD / 2 - 1.6, w: 6, d: 2.4, seats: 0, servers: 0, label: 'ทางเข้า' });
  L.rooms.push({ id: 'ER-out', type: 'exit', building: 'ER', clinicId: null, x: eW / 2 - 5, z: eD / 2 - 1.6, w: 6, d: 2.4, seats: 0, servers: 0, label: 'ทางออก' });
  for (let z = -eD / 2 + 4; z < eD / 2; z += 9) { L.props.push({ type: 'tree', building: 'ER', x: eW / 2 + 3.2, z, s: 1 }); }
  return L;
}

const ROLE = {
  reg:        { stage: 'reg',        scope: 'clinic', seat: true,  svc: 'counter' },
  vitals:     { stage: 'vitals',     scope: 'clinic', seat: true,  svc: 'counter' },
  wait:       { stage: 'doctor',     scope: 'clinic', seat: true },
  consult:    { stage: 'doctor',     scope: 'clinic', svc: 'room' },
  lab:        { stage: 'lab',        scope: 'bld',    seat: true,  svc: 'counter' },
  cashier:    { stage: 'cashier',    scope: 'bld',    seat: true,  svc: 'counter' },
  pharm:      { stage: 'pharm',      scope: 'bld',    seat: true,  svc: 'counter' },
  pharm_home: { stage: 'pharm_home', scope: 'bld',    seat: true,  svc: 'counter' },
  er_wait:    { stage: 'er',         scope: 'er',     seat: true },
  er:         { stage: 'er',         scope: 'er',     svc: 'beds' },
};
const SEAT_PX = 0.95, SEAT_PZ = 1.1;

// Turns LAYOUT JSON into runtime structures: world coordinates, units (waiting area + service points), chairs, desks.
function deriveLayout(L) {
  const D = { layout: L, buildings: new Map(), units: new Map(), chairs: [], desks: [], entrance: {}, exit: {}, clinicRect: {}, bldRect: {}, rooms: [] };
  L.buildings.forEach(b => { D.buildings.set(b.id, b); D.bldRect[b.id] = { minX: b.x - b.w / 2, maxX: b.x + b.w / 2, minZ: b.z - b.d / 2, maxZ: b.z + b.d / 2 }; });
  for (const r of L.rooms) {
    const b = D.buildings.get(r.building);
    const wr = Object.assign({}, r, { wx: b.x + r.x, wz: b.z + r.z });
    D.rooms.push(wr);
    if (r.type === 'entrance') { D.entrance[r.building] = { x: wr.wx, z: wr.wz }; continue; }
    if (r.type === 'exit') { D.exit[r.building] = { x: wr.wx, z: wr.wz }; continue; }
    const role = ROLE[r.type]; if (!role) continue;
    const key = role.scope === 'clinic' ? `${r.clinicId}:${role.stage}` : role.scope === 'bld' ? `${r.building}:${role.stage}` : 'er:er';
    let u = D.units.get(key);
    if (!u) { u = { key, stage: role.stage, building: r.building, clinicId: role.scope === 'bld' ? null : r.clinicId, seats: 0, servers: 0, seatPos: [], svcPos: [], seatedAll: !!CONFIG.seatedDuringService[role.stage], seatRoom: null, standCols: 1, standRow0: 0, standZ0: 0, sgn: 1 }; D.units.set(key, u); }
    if (r.clinicId) { const cr = D.clinicRect[r.clinicId] || (D.clinicRect[r.clinicId] = { minX: 1e9, maxX: -1e9, minZ: 1e9, maxZ: -1e9, building: r.building }); cr.minX = Math.min(cr.minX, wr.wx - r.w / 2); cr.maxX = Math.max(cr.maxX, wr.wx + r.w / 2); cr.minZ = Math.min(cr.minZ, wr.wz - r.d / 2); cr.maxZ = Math.max(cr.maxZ, wr.wz + r.d / 2); }
    const sgn = r.edge === 'S' ? -1 : 1;                       // direction from counter edge toward chairs
    const edgeZ = wr.wz - sgn * r.d / 2;
    if (role.seat) {
      const cols = Math.max(1, Math.floor((r.w - 1) / SEAT_PX)), rowsCap = Math.max(1, Math.floor((r.d - 2.2) / SEAT_PZ));
      const seats = Math.min(r.seats || 0, cols * rowsCap);
      u.seats = seats; u.seatRoom = wr; u.sgn = sgn;
      for (let i = 0; i < seats; i++) {
        const row = Math.floor(i / cols), col = i % cols;
        const p = { x: wr.wx - (cols - 1) * SEAT_PX / 2 + col * SEAT_PX, z: edgeZ + sgn * (2.0 + row * SEAT_PZ), rot: sgn > 0 ? Math.PI : 0 };
        u.seatPos.push(p); D.chairs.push({ x: p.x, z: p.z, rot: p.rot, building: r.building });
      }
      u.standCols = Math.max(1, Math.floor((r.w - 1) / 0.8));
      u.standZ0 = edgeZ + sgn * (2.0 + Math.ceil(Math.max(seats, 1) / cols) * SEAT_PZ - 0.1);
      u.standX0 = wr.wx;
      u.edgeZ = edgeZ;
    }
    if (role.svc === 'room') { u.servers += r.servers || 1; u.svcPos.push({ x: wr.wx, z: wr.wz, room: true }); }
    else if (role.svc === 'beds') {
      const n = r.servers || 1, per = Math.max(1, Math.floor(r.w / 2.6)); u.servers += n;
      for (let i = 0; i < n; i++) { const col = i % per, row = Math.floor(i / per); const p = { x: wr.wx - (per - 1) * 2.6 / 2 + col * 2.6, z: wr.wz - r.d / 2 + 2 + row * 2.8 }; u.svcPos.push(p); D.desks.push({ x: p.x, z: p.z, w: 1.5, d: 0.9, bed: true }); }
    } else if (role.svc === 'counter') {
      const n = r.servers || 1, per = Math.max(1, Math.floor(r.w / 1.25)), nd = Math.min(n, per); u.servers += n;
      const xs = []; for (let k = 0; k < nd; k++) xs.push(wr.wx - r.w / 2 + (k + 0.5) * r.w / nd);
      xs.forEach(x => D.desks.push({ x, z: edgeZ + sgn * 0.3, w: Math.min(2.2, r.w / nd - 0.2), d: 0.6, dir: sgn }));
      for (let i = 0; i < n; i++) u.svcPos.push({ x: xs[i % nd], z: edgeZ + sgn * (0.95 + Math.floor(i / nd) * 0.8) });
    }
  }
  return D;
}
// world position of the i-th person in the waiting area of a unit (seat, then standing grid behind the chairs)
function unitSlot(u, i) {
  if (i < u.seatPos.length) return { x: u.seatPos[i].x, z: u.seatPos[i].z, rot: u.seatPos[i].rot, sit: true };
  const j = i - u.seatPos.length, col = j % u.standCols, row = Math.floor(j / u.standCols);
  return { x: (u.standX0 || 0) + (col - (u.standCols - 1) / 2) * 0.8, z: u.standZ0 + u.sgn * (row * 0.8 + 0.4), rot: u.sgn > 0 ? Math.PI : 0, sit: false };
}

/*
 * runDay(dateStr, derived, surges) -> { date, seed, patients[] }

    const c = CLINIC_BY_ID[s.clinicId]; if (!c) return;

    if (ev.type === 'arr') arrive(ev.p, 0, ev.t);

}

// ===== 5. DATA ADAPTER =====
/*
 * Adapter interface (the ONLY thing UI/renderer read):
 *   getSnapshot(simTime) -> {
 *     time, date,
 *     agents: [ { id, q:'MED-023', clinicId, building, stage, unit, state:'queue'|'service', srv, since, waitMin, lane } ],
 *     stageCounts: { <scope>: { <stage>: { waiting, service } } },        scope = 'all' | 'OPD1'.. | 'ER'
 *     clinicStats: { <clinicId>: { building, inside, throughputHr, stages: { <stage>: { waiting, service, avgWait } } } },
 *     unitStats:   { <unitKey>: { key, stage, building, clinicId, waiting, service, seats, servers, avgWait } },
 *     kpis:        { <scope>: { inside, waiting, avgWait, over, throughputHr, pharmHosp, pharmHome, arrived, done } }
 *   }

 *   setDate('YYYY-MM-DD')   setMode('live'|'replay')
 */

    const c = CLINIC_BY_ID[clinicId]; if (!c) return;
    this.surges.push({ clinicId, t, n: Math.round((c.seats.reg + c.seats.vitals + c.seats.wait) * 0.85), spread: 4, scale: 0.3 });

    for (const c of Object.values(clinicStats)) for (const s of Object.values(c.stages)) s.avgWait = s.waiting ? s.waitSum / s.waiting : 0;
    for (const u of Object.values(unitStats)) u.avgWait = u.waiting ? u.waitSum / u.waiting : 0;
    return { time: t, date: this.date, agents, stageCounts, clinicStats, unitStats, kpis };
  }
}

  const tour = CONFIG.clinics.map(c => c.id).concat(['ER']);
  let idx = -1, nextAt = 0, calls = [], lastCalls = '';
  const track = $('#tvTrack');
  const setTrack = () => { const html = calls.length ? calls.map(c => `<span>${I18N.tv.call} ${c.q} ${I18N.tv.room} ${c.room}</span>`).join('') : `<span>${I18N.tv.noCall}</span>`; track.innerHTML = html; track.style.setProperty('--tickdur', Math.max(24, (track.scrollWidth + innerWidth) / 170) + 's'); };
  track.addEventListener('animationiteration', setTrack);
  if (REDUCED) setInterval(setTrack, 10000);   // no scrolling animation: refresh the static ticker periodically
  UI.update = snap => {
    const k = snap.kpis.all, id = tour[Math.max(0, idx)], c = snap.clinicStats[id];
    $('#tvBoard').innerHTML = `<div class="r"><span>${I18N.tv.total}</span><b>${k.inside.toLocaleString('th-TH')}</b></div><div class="r"><span>${I18N.tv.wait}</span><b>${fmt1(k.avgWait)} ${I18N.min}</b></div><div class="r"><span>${I18N.tv.red}</span><b>${k.clinicsRed}/${k.clinicsTotal}</b></div><div class="r"><span>${I18N.tv.done}</span><b>${k.done.toLocaleString('th-TH')}</b></div><div class="r" style="margin-top:6px;color:var(--teal-d)"><span>${App.clock.kind === 'live' ? I18N.live : I18N.replay}</span><b>${fmtClock(App.clock.simMin)}</b></div>`;
    if (c) $('#tvHead').innerHTML = `<h1>${clinicName(id)}</h1><div class="sub">${id === 'ER' ? I18N.erTab : 'OPD ' + c.building.replace('OPD', '')} · ${c.inside} ${I18N.people}</div>${lvChip(c.level)}`;
    $('#tvClosed').classList.toggle('hidden', !App.closed || App.clock.kind !== 'live');
    calls = snap.agents.filter(a => a.stage === 'consult').sort((a, b) => b.since - a.since).slice(0, 10).map(a => ({ q: a.q, room: a.srv + 1 }));
    if (!track.firstChild) setTrack();
  };
  UI.tick = () => {
    const now = performance.now();
    if (now >= nextAt) { idx = (idx + 1) % tour.length; nextAt = now + CONFIG.tour.intervalSec * 1000 * (REDUCED ? 2 : 1); if (App.world) App.world.focusClinic(tour[idx]); if (App.snap) UI.update(App.snap); }
  };
  UI.onClock = () => {};
}

// ---------- mobile UI ----------
function buildMobileUI(ui) {
  ui.className = 'mob'; $('#stage').classList.add('hidden');
  ui.innerHTML = `<div class="mobile">
    <div class="card pt"><h1>${I18N.mobile.title}</h1><div class="muted fine" id="mClock"></div>
      <div class="muted fine" style="margin-top:6px">${I18N.mobile.hint}</div>
      <form class="q" id="mForm"><input type="text" id="mQ" inputmode="text" autocomplete="off" autocapitalize="characters" maxlength="9" placeholder="${I18N.mobile.ph}" aria-label="${I18N.mobile.hint}"><button class="btn" type="submit">${I18N.mobile.go}</button></form>
      <div class="samples-wrap"><div class="muted fine" style="margin-top:10px">${I18N.mobile.samples}</div><div class="samples" id="mSamples"></div></div>
    </div>
    <div class="card pt" id="mRes" style="margin-top:10px"></div>
    <div class="card pt" id="mOff" style="margin-top:10px;text-align:center"><h2 style="margin:0">${I18N.offHours}</h2><p class="muted">${I18N.offHoursHint}</p><button class="btn" id="mReplay">${I18N.viewReplay}</button></div>
    <div class="row" style="margin-top:10px"><button class="btn ghost" id="m3d" style="width:100%">${I18N.mobile.show3d}</button></div>
    <div id="thumb" class="hidden" style="height:230px;margin-top:10px;position:relative;border-radius:14px;overflow:hidden;box-shadow:var(--shadow)"></div>
  </div>`;
  let q = '';
  const norm = s => { const m = s.toUpperCase().replace(/\s+/g, '').match(/^([A-Z]{2,3})-?(\d{1,3})$/); return m ? `${m[1]}-${m[2].padStart(3, '0')}` : s.toUpperCase(); };
  const route = ['reg', 'vitals', 'wait', 'consult', 'lab', 'cashier', 'pharm'];
  function estimate(a, snap) {
    const c = CLINIC_BY_ID[a.clinicId], u = App.derived.units.get(a.unit), us = snap.unitStats[a.unit], R = CONFIG.routing;
    const mean = a.stage === 'pharm' && a.unit.endsWith('pharm_home') ? CONFIG.homeSvc.m : c.svc[a.stage === 'wait' || a.stage === 'consult' ? 'doctor' : a.stage].m;
    const ahead = snap.agents.filter(x => x.unit === a.unit && x.qStart < a.qStart && (x.state === 'queue' || (u && u.seatedAll))).length;
    let est = 0;
    if (a.state === 'queue') est += Math.ceil((ahead + 1) / Math.max(1, u ? u.servers : 1)) * mean; else est += Math.max(0, mean - (snap.time - a.since));
    const idx = route.indexOf(a.stage), svc = k => c.svc[k].m, bw = st => (snap.unitStats[`${c.building}:${st}`] || { avgWait: 0 }).avgWait;
    const doctorPending = idx <= 3 && a.stage !== 'consult';
    if (a.stage === 'reg') est += svc('vitals');
    if (idx <= 1) est += (us ? 0 : 0) + (snap.unitStats[`${c.id}:doctor`] ? snap.unitStats[`${c.id}:doctor`].avgWait : 0);
    if (idx <= 2) est += svc('doctor');
    if (idx <= 3) { est += (c.pctLab ?? R.pctLab) * (svc('lab') + bw('lab')); }
    if (idx <= 4 || a.stage === 'lab') est += 0;
    if (idx < 5) est += svc('cashier') + bw('cashier');
    if (idx < 6) est += (1 - R.pctNoMeds) * (svc('pharm') + bw('pharm'));
    void doctorPending;
    return { ahead, eta: Math.max(1, Math.round(est)) };
  }
  function lookup() {
    const snap = App.snap, box = $('#mRes'); if (!snap) return;
    $('#mOff').classList.toggle('hidden', !(App.closed && App.clock.kind === 'live'));
    $('#mClock').textContent = `${App.clock.kind === 'live' ? I18N.live : I18N.replay} · ${fmtDateBE(App.clock.date)} · ${fmtClock(App.clock.simMin)}`;
    const samples = snap.agents.filter(a => a.clinicId !== 'ER' && a.state === 'queue').slice(0, 6);
    const sm = $('#mSamples'), html = samples.map(a => `<button class="pill" data-q="${a.q}">${a.q}</button>`).join('');
    if (sm.dataset.h !== html) { sm.dataset.h = html; sm.innerHTML = html; $$('[data-q]', sm).forEach(b => b.onclick = () => { $('#mQ').value = b.dataset.q; q = b.dataset.q; lookup(); }); }
    if (!q) { box.classList.add('hidden'); return; } box.classList.remove('hidden');
    const a = snap.agents.find(x => x.q === q);
    if (!a) { box.innerHTML = `<div class="err">${I18N.mobile.notFound}</div>`; return; }
    const e = estimate(a, snap), cs = snap.clinicStats[a.clinicId], u = App.derived.units.get(a.unit);
    const stName = a.stage === 'pharm' ? `${I18N.stage.pharm} (${I18N.lane[a.lane] || ''})` : I18N.stage[a.stage];
    const turn = a.state === 'service' && a.stage === 'consult';
    box.innerHTML = `
      <div class="row sp"><div class="big">${a.q}</div>${cs ? lvChip(cs.level) : ''}</div>
      <div class="muted">${I18N.mobile.clinic} ${clinicName(a.clinicId)} · ${a.building === 'ER' ? I18N.erTab : 'OPD ' + a.building.replace('OPD', '')}</div>
      <div class="grid2"><div class="stat"><span>${I18N.mobile.current}</span><div style="font-weight:700;font-size:16px">${stName}</div>${a.stage === 'consult' ? `<div>${I18N.mobile.roomNow} ${a.srv + 1}</div>` : ''}</div>
        <div class="stat"><span>${I18N.mobile.ahead}</span><div class="big">${e.ahead}</div></div>
        <div class="stat"><span>${I18N.mobile.eta}</span><div class="big">~${e.eta} <span style="font-size:14px">${I18N.min}</span></div></div>
        <div class="stat"><span>${I18N.detail.avgWait}</span><div class="big">${Math.round(a.waitMin)} <span style="font-size:14px">${I18N.min}</span></div></div></div>
      ${turn ? `<div class="chip live" style="margin-top:8px;background:var(--green-bg);color:var(--green)">${I18N.mobile.yourTurn}</div>` : ''}
      <div class="steps" aria-label="${I18N.mobile.steps}">${route.filter(s => s !== 'consult').map(s => { const cur = a.stage === s || (s === 'wait' && a.stage === 'consult'), done = route.indexOf(s) < route.indexOf(a.stage); return `<span class="step ${cur ? 'now' : done ? 'done' : ''}">${done ? '✓ ' : ''}${s === 'wait' ? I18N.stageShort.wait + '/ตรวจ' : I18N.stageShort[s]}</span>`; }).join('')}</div>
      <div class="muted fine" style="margin-top:8px">${I18N.mobile.etaNote}</div>`;
    if (App.world && App.world.visible && u && !$('#thumb').classList.contains('hidden') && App.clinic !== a.clinicId) { App.clinic = a.clinicId; App.world.focusClinic(a.clinicId); }
  }
  $('#mForm').onsubmit = e => { e.preventDefault(); q = norm($('#mQ').value.trim()); $('#mQ').value = q; lookup(); };
  $('#mReplay').onclick = () => goReplay(shiftDate(bkkNow().date, -1), 9 * 60);
  $('#m3d').onclick = () => {
    const th = $('#thumb'), show = th.classList.contains('hidden'); th.classList.toggle('hidden', !show); $('#m3d').textContent = show ? I18N.mobile.hide3d : I18N.mobile.show3d;
    if (show) { if (!App.world) createWorld(th, false); if (!App.world) return; App.world.visible = true; App.world.resize(); if (App.snap) { App.world.setLevels(App.snap); App.world.setSnapshot(App.snap, true); } } else if (App.world) App.world.visible = false;
  };
  UI.update = lookup; UI.onClock = lookup;
}

// ===== 9. MODES =====
// ---- clock & data flow ----
function goLive() {
  const c = App.clock, n = bkkNow(); c.kind = 'live'; c.playing = false; App.adapter.setMode('live'); App.adapter.setDate(n.date); c.date = n.date; c.simMin = n.min;
  Density.reset(); if (App.world) App.world.clearAgents(); publish(true, true); UI.onClock();
}
function goReplay(date, startMin = 8 * 60, speed) {
  const c = App.clock; c.kind = 'replay'; c.date = date; c.simMin = startMin; c.playing = true; c.speed = speed || (MODE === 'tv' ? 10 : MODE === 'mobile' ? 1 : CONFIG.ui.defaultReplaySpeed);
  App.adapter.setMode('replay'); App.adapter.setDate(date); Density.reset(); if (App.world) App.world.clearAgents(); App.closed = false; publish(true, true); UI.onClock();
}
function onSnapshot(snap) {
  Density.apply(snap); App.snap = snap;
  if (App.world) { App.world.setLevels(snap); App.world.setSnapshot(snap, App.forceJump); App.world._simSpeed = App.clock.kind === 'replay' ? App.clock.speed : 1; }
  App.forceJump = false; UI.update(snap);
}
function publish(force, jump) { App.forceJump = !!jump; App.lastPub = performance.now(); App.adapter.publish(App.clock.simMin); }
function tick(dt) {
  const c = App.clock, H = CONFIG.hours;
  if (c.kind === 'live') {
    const n = bkkNow(); if (n.date !== c.date) { App.adapter.setDate(n.date); c.date = n.date; Density.reset(); }
    c.simMin = n.min; const closed = n.min < H.open || n.min >= H.end;
    if (closed !== App.closed) { App.closed = closed; UI.onClock(); }
  } else if (c.playing) {
    c.simMin += dt * c.speed / 60;
    if (c.simMin >= H.end) { c.simMin = H.end; c.playing = false; UI.onClock(); }
  }
  if (!App.lastClockUi || performance.now() - App.lastClockUi > 400) { App.lastClockUi = performance.now(); UI.onClock(); }
  if (performance.now() - App.lastPub >= CONFIG.ui.snapshotMs) publish();
  if (UI.tick) UI.tick();
  if (DEBUG) { App.frames = (App.frames || 0) + 1; const now = performance.now(); if (!App.fpsT) App.fpsT = now; if (now - App.fpsT >= 500) { const el = $('#fps'); if (el) el.textContent = Math.round(App.frames * 1000 / (now - App.fpsT)); App.frames = 0; App.fpsT = now; } }
}
function createWorld(container, interactive) {
  try { App.world = new World(container, App.derived, { interactive }); }
  catch (e) { console.error(e); container.innerHTML = `<div class="card" style="margin:20px">${I18N.webglFail}</div>`; return null; }
  if (interactive && innerWidth > 900) App.world.centerShiftPx = 60;
  App.world.onFrame = tick; App.world.onPick = id => selectClinic(id); App.world.setColorMode(App.colorMode);
  if (App.snap) { App.world.setLevels(App.snap); App.world.setSnapshot(App.snap, true); }
  return App.world;
}

// ===== 10. DEBUG =====
function buildDebug() {
  const d = document.createElement('div'); d.id = 'debug'; d.className = 'card pt';
  d.innerHTML = `<b>${I18N.debug.title}</b><div>${I18N.debug.fps}: <span id="fps">–</span> · ${I18N.debug.seed}: <code id="seed"></code></div>
    <div class="row">${CONFIG.clinics.map(c => `<button class="btn ghost sm" data-surge="${c.id}" title="${c.nameTh}">${I18N.debug.surge} ${c.id}</button>`).join('')}<button class="btn sm" id="dbgClear">${I18N.debug.clear}</button></div>
    <div class="muted fine" id="dbgInfo"></div>`;
  $('#ui').appendChild(d); d.style.pointerEvents = 'auto'; if (MODE === 'tv') d.style.fontSize = '14px';
  d.querySelectorAll('[data-surge]').forEach(b => b.onclick = () => { App.adapter.addSurge(b.dataset.surge, App.clock.simMin); publish(true); $('#dbgInfo').textContent = `${I18N.debug.surgeOn}: ${b.dataset.surge} @ ${fmtClock(App.clock.simMin)}`; });
  $('#dbgClear').onclick = () => { App.adapter.clearSurges(); publish(true); $('#dbgInfo').textContent = ''; };
  setInterval(() => { const s = $('#seed'); if (s) s.textContent = App.adapter.seed; }, 700);
}
// Console verification: determinism + KPI consistency
function selfCheck() {
  const a1 = new SimulatedAdapter(App.derived), a2 = new SimulatedAdapter(App.derived); a1.setDate('2026-03-02'); a2.setDate('2026-03-02');
  const sig = a => { const s = a.getSnapshot(9 * 60); return JSON.stringify([s.agents.length, s.kpis.all.inside, s.kpis.all.waiting, s.stageCounts.all]); };
  const s1 = sig(a1), s2 = sig(a2);
  console.info('[selfCheck] 09:00 seed opd:2026-03-02 run1', s1); console.info('[selfCheck] 09:00 seed opd:2026-03-02 run2', s2); console.info('[selfCheck] deterministic =', s1 === s2);
  const s = a1.getSnapshot(10 * 60), sum = Object.values(s.stageCounts.all).reduce((t, x) => t + x.waiting + x.service, 0);
  console.info('[selfCheck] KPI inside =', s.kpis.all.inside, ' sum(stageCounts) =', sum, ' equal =', s.kpis.all.inside === sum);
}

// ---- boot ----
async function boot() {
  document.getElementById('badge').textContent = I18N.badge;
  document.body.classList.add('mode-' + MODE); if (REDUCED) document.body.classList.add('reduce');
  let layout; const lurl = QUERY.get('layout');
  if (lurl) { try { layout = await (await fetch(lurl)).json(); } catch (e) { console.warn('layout load failed, using placeholder', e); } }
  layout = layout || buildPlaceholderLayout(CONFIG);
  App.derived = deriveLayout(layout);
  const ad = App.adapter = new SimulatedAdapter(App.derived); ad.subscribe(onSnapshot);
  const ui = $('#ui');
  if (MODE === 'command') buildCommandUI(ui); else if (MODE === 'tv') buildTvUI(ui); else buildMobileUI(ui);
  const qd = QUERY.get('date'), qt = (QUERY.get('t') || '').match(/^(\d{1,2}):(\d{2})$/);
  if (qd && /^\d{4}-\d{2}-\d{2}$/.test(qd)) goReplay(qd, qt ? +qt[1] * 60 + +qt[2] : 9 * 60, +QUERY.get('speed') || undefined); else goLive();
  if (MODE !== 'mobile') { const w = createWorld($('#stage'), MODE === 'command'); if (w) { w.focusScope('all'); } }
  if (DEBUG) { buildDebug(); selfCheck(); }
  if (MODE === 'mobile') { /* no render loop until the 3D thumbnail is opened: drive the clock with a timer */
    let last = performance.now(); setInterval(() => { const n = performance.now(); if (!App.world || !App.world.visible) tick((n - last) / 1000); last = n; }, 250); }
  App.api = { selectClinic, setScope, goLive, goReplay, publish, setColorMode }; window.__app = App;
}
boot();
