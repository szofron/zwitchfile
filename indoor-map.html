<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>แผนที่นำทางในอาคาร</title>
<meta name="description" content="ต้นแบบระบบแผนที่นำทางในอาคารโรงพยาบาลแบบ 3 มิติ — แผนผังจำลองเพื่อการสาธิต">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<style>
/* Layout: full-bleed isometric floor plan; a left control rail (bottom sheet on phones); floor switcher + SOS on the right. Single light look (wayfinding signage). */
:root{
  color-scheme:light;
  --bg:#e8eff0; --card:#ffffff; --ink:#1b2a36; --muted:#5d6f7f; --line:#dde6ea; --soft:#f2f7f8;
  --route:#0e93a8; --route-d:#0a6f80; --route-l:#ddf2f5;
  --start:#2563eb; --dest:#d63d74; --exit:#15803d; --exit-l:#e2f5e8; --sos:#c62828; --sos-l:#fdeaea;
  --shadow:0 8px 26px rgba(25,55,70,.14),0 1px 3px rgba(25,55,70,.08);
  --font:'Noto Sans Thai','Sarabun','Leelawadee UI',Tahoma,system-ui,sans-serif;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--route);outline-offset:2px}
#stage{position:fixed;inset:0}
#stage canvas{display:block}
.css2d{position:absolute;inset:0;pointer-events:none;overflow:hidden}

.panel{position:fixed;left:12px;top:12px;bottom:12px;width:372px;display:flex;flex-direction:column;gap:10px;z-index:10;pointer-events:none}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px;pointer-events:auto}
.head{display:flex;gap:10px;align-items:center}
.logo{width:36px;height:36px;border-radius:10px;background:var(--route);display:grid;place-items:center;flex:none}
.head h1{margin:0;font-size:17px;line-height:1.2;text-wrap:balance}
.head small{color:var(--muted);font-size:12px}
.lbl-s{font-size:11.5px;letter-spacing:.04em;color:var(--muted);font-weight:600;margin:0 0 5px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,input[type=search]{border:1px solid #c9d7de;border-radius:10px;background:#fff;padding:7px 10px;min-width:0}
input[type=search]{width:100%;font-size:15px}
.btn{border:0;border-radius:10px;background:var(--route);color:#fff;font-weight:600;padding:7px 14px}
.btn:hover{background:var(--route-d)}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.ghost:hover,.btn.ghost[aria-pressed="true"]{background:var(--route-l);color:var(--route-d)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:3px 11px;font-size:12.5px}
.chip[aria-pressed="true"]{background:var(--route);border-color:var(--route);color:#fff}
.search{display:flex;flex-direction:column;min-height:0;flex:1 1 auto}
.results{list-style:none;margin:8px 0 0;padding:0;overflow:auto;min-height:0;flex:1 1 auto;scrollbar-width:thin}
.results li button{width:100%;display:grid;grid-template-columns:12px 1fr auto;gap:9px;align-items:center;text-align:left;background:none;border:0;border-radius:9px;padding:7px 6px}
.results li button:hover,.results li button[aria-current="true"]{background:var(--route-l)}
.results .dot{width:12px;height:12px;border-radius:4px;border:1px solid rgba(0,0,0,.12)}
.results .fl{font-size:12px;color:var(--muted);white-space:nowrap}
.results .en{display:block;font-size:11.5px;color:var(--muted)}
.empty{color:var(--muted);font-size:13px;padding:8px 4px}

.route{display:flex;flex-direction:column;min-height:0;flex:1 1 auto}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0 8px}
.sum div{background:var(--soft);border-radius:10px;padding:6px 8px}
.sum b{display:block;font-size:19px;font-variant-numeric:tabular-nums;line-height:1.15}
.sum span{font-size:11.5px;color:var(--muted)}
.dest-name{font-size:16px;font-weight:700;margin:0;text-wrap:balance}
.steps{list-style:none;margin:0;padding:0;overflow:auto;min-height:0;flex:1 1 auto;scrollbar-width:thin}
.steps li{display:grid;grid-template-columns:30px 1fr;gap:8px;padding:7px 4px;border-top:1px solid var(--line);cursor:pointer;border-radius:8px}
.steps li:hover{background:var(--soft)}
.steps .ic{width:30px;height:30px;border-radius:9px;background:var(--route-l);color:var(--route-d);display:grid;place-items:center;font-weight:700;font-size:16px}
.steps .ic.v{background:#eae6fb;color:#5b3fc4}
.steps .ic.end{background:#fbe3ec;color:var(--dest)}
.steps .ic.exit{background:var(--exit-l);color:var(--exit)}
.steps small{display:block;color:var(--muted);font-size:12px}
.opt{display:flex;align-items:center;gap:8px;font-size:13px;margin:2px 0 6px}
.opt input{width:18px;height:18px;accent-color:var(--route)}
.warn{background:var(--sos-l);color:var(--sos);border-radius:10px;padding:7px 10px;font-weight:600;font-size:13px;margin-bottom:6px}
.note{font-size:12px;color:var(--muted)}

.floors{position:fixed;right:14px;top:56px;display:flex;flex-direction:column;gap:6px;z-index:10}
.floors button{width:64px;height:54px;border-radius:12px;border:0;background:var(--card);box-shadow:var(--shadow);font-weight:700;font-size:15px;position:relative;line-height:1.1}
.floors button small{display:block;font-size:10.5px;font-weight:500;color:var(--muted)}
.floors button[aria-pressed="true"]{background:var(--route);color:#fff}
.floors button[aria-pressed="true"] small{color:#e2f7fa}
.floors button .has{position:absolute;top:5px;right:6px;width:9px;height:9px;border-radius:50%;background:var(--dest);border:2px solid #fff}
.sos{position:fixed;right:14px;bottom:14px;z-index:10;border:0;border-radius:14px;background:var(--sos);color:#fff;font-weight:700;padding:12px 16px;box-shadow:var(--shadow)}
.sos:hover{filter:brightness(1.08)}
#badge{position:fixed;top:10px;right:14px;z-index:20;background:#fff7d6;color:#6f5000;border:1.5px solid #f0c23a;border-radius:999px;padding:4px 12px;font-weight:600;font-size:12.5px;box-shadow:var(--shadow);white-space:nowrap}
.legend{position:fixed;right:14px;bottom:72px;z-index:10;font-size:12px;padding:9px 12px;display:grid;gap:4px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-2px;border:1px solid rgba(0,0,0,.12)}
.legend .ln{display:inline-block;width:18px;height:5px;border-radius:3px;background:var(--route);margin-right:6px;vertical-align:2px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:30;background:var(--ink);color:#fff;border-radius:12px;padding:8px 14px;font-size:13.5px;box-shadow:var(--shadow)}
[hidden]{display:none!important}

/* 3D labels */
.rl{background:rgba(255,255,255,.92);border:1px solid #cfe0e6;border-radius:8px;padding:1px 7px;font-size:11.5px;font-weight:600;white-space:nowrap;box-shadow:0 2px 8px rgba(25,55,70,.14);display:flex;align-items:center;gap:5px}
.rl i{width:8px;height:8px;border-radius:3px;display:inline-block}
.rl.small{font-size:10.5px;font-weight:500;padding:0 5px}
.rl.exit{background:var(--exit);color:#fff;border-color:var(--exit)}
.rl.dest{background:var(--dest);color:#fff;border-color:var(--dest);font-size:13px;padding:3px 10px}
.rl.start{background:var(--start);color:#fff;border-color:var(--start);font-size:13px;padding:3px 10px}
.rl.kiosk{background:#fff;color:var(--start);border-color:#bcd0f7;font-size:10.5px}
.rl.compass{background:none;border:0;box-shadow:none;font-size:15px;font-weight:700;color:var(--muted)}

/* kiosk mode: larger type, no start picker */
.kiosk-mode{font-size:16px}
.kiosk-mode .panel{width:440px}
.kiosk-mode .head h1{font-size:21px}
.kiosk-mode input[type=search]{font-size:18px;padding:10px 12px}
.kiosk-mode .results li button{padding:10px 8px;font-size:16px}

@media (max-width:760px){
  .panel{left:0;right:0;top:auto;bottom:0;width:auto;max-height:52%;gap:0}
  .panel>.card{border-radius:18px 18px 0 0;box-shadow:0 -6px 22px rgba(25,55,70,.16)}
  .panel>.card+.card{border-radius:0;box-shadow:none;border-top:1px solid var(--line)}
  .panel .head{display:none}
  .panel{padding-bottom:env(safe-area-inset-bottom,0px)}
  .floors{top:48px;right:10px}
  .floors button{width:56px;height:46px}
  .sos{top:48px;bottom:auto;left:10px;right:auto;padding:9px 12px;font-size:13px}
  .legend{display:none}
  #badge{left:10px;right:10px;text-align:center;font-size:11.5px;white-space:normal}
  .card{padding:10px 14px}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="stage"></div>
<div id="badge" role="note">แผนผังจำลองเพื่อการสาธิต — ไม่ใช่ผังจริงของโรงพยาบาล</div>

<aside class="panel" aria-label="ค้นหาและนำทาง">
  <div class="card">
    <div class="head">
      <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 2C8 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3-7-7-7z" fill="#fff"/><circle cx="12" cy="9" r="2.6" fill="#0e93a8"/></svg></div>
      <div><h1>แผนที่นำทางในอาคาร</h1><small>ต้นแบบ Indoor Map · นำร่องชั้น 1 อาคารหลัก</small></div>
    </div>
    <div style="margin-top:10px" id="startBox">
      <p class="lbl-s">จุดเริ่มต้น</p>
      <div class="row">
        <select id="start" style="flex:1" aria-label="จุดเริ่มต้น"></select>
        <button class="btn ghost" id="pickStart" aria-pressed="false" title="แตะบนแผนที่เพื่อกำหนดจุดเริ่มต้น">เลือกบนแผนที่</button>
      </div>
    </div>
    <div id="kioskHere" class="note" hidden></div>
  </div>

  <div class="card search" id="searchCard">
    <p class="lbl-s">ต้องการไปที่ไหน</p>
    <input type="search" id="q" placeholder="ค้นหา เช่น รับยา, ห้องน้ำ, ศูนย์หัวใจ" autocomplete="off" aria-label="ค้นหาปลายทาง">
    <div class="chips" id="chips" role="group" aria-label="หมวดหมู่"></div>
    <ul class="results" id="results"></ul>
  </div>

  <div class="card route" id="routeCard" hidden>
    <div class="row" style="justify-content:space-between;align-items:flex-start;flex-wrap:nowrap">
      <div style="min-width:0"><p class="lbl-s" id="routeKind">เส้นทางไป</p><p class="dest-name" id="destName"></p></div>
      <button class="btn ghost" id="clear">ล้าง</button>
    </div>
    <div class="warn" id="sosWarn" hidden>ห้ามใช้ลิฟต์ขณะเกิดเหตุเพลิงไหม้ ใช้บันไดหนีไฟและเดินตามป้ายทางออกสีเขียว</div>
    <div class="sum"><div><b id="sDist">–</b><span>ระยะทาง</span></div><div><b id="sTime">–</b><span>เวลาโดยประมาณ</span></div><div><b id="sFloors">–</b><span>ชั้น</span></div></div>
    <label class="opt"><input type="checkbox" id="accessible"> ไม่ใช้บันได (รถเข็น / ผู้สูงอายุ / รถเข็นเด็ก)</label>
    <ol class="steps" id="steps"></ol>
    <p class="note" id="routeNote"></p>
  </div>
</aside>

<div class="floors" id="floors" role="group" aria-label="เลือกชั้น"></div>
<div class="card legend" id="legend" aria-label="คำอธิบายสี"></div>
<button class="sos" id="sos">ทางหนีไฟที่ใกล้ที่สุด</button>
<div class="toast" id="toast" hidden></div>

<script type="module">
/*
 * แผนที่นำทางในอาคาร — DEMO (single file, no build step)
 * ============================================================================
 * ASSUMPTIONS
 *  - The floor plan is a PLACEHOLDER (2 floors, main building). It is not the real hospital layout.
 *    Room names follow the proposal (ศูนย์หัวใจ ศูนย์ไต ศูนย์ถันย์ ศูนย์เต้านม NKC, ...); positions are invented.
 *  - Routing is computed on a corridor graph (Dijkstra). Positioning (BLE / UWB) is out of scope:
 *    the start point is a kiosk, or a point the user taps on the map.
 *  - Walking speed 1.2 m/s, wheelchair 0.8 m/s, lift wait 45 s, stairs 25 s per floor (CONFIG).
 *  - Emergency mode never uses lifts and only ends at ground-floor exits.
 *  - Kiosk mode: ?kiosk=K1 (or #K1). Start is locked and the route resets after CONFIG.idleResetSec idle.
 * ============================================================================
 */
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

// ===== 1. CONFIG =====
const CONFIG = {
  speed: { walk: 1.2, wheelchair: 0.8 },          // m/s
  lift: { waitSec: 45, costM: 35 },               // routing cost in "metre equivalents"
  stairs: { secPerFloor: 25, costM: 18 },
  corridorW: 3, wallH: 1.2, floorGap: 0,
  idleResetSec: 90,
  categories: {
    clinic:   { th: 'คลินิก / ศูนย์', color: '#f7d3dc' },
    service:  { th: 'บริการ',         color: '#d4ecf5' },
    facility: { th: 'สิ่งอำนวยความสะดวก', color: '#dcefd2' },
    shop:     { th: 'ร้านค้า',          color: '#fde9c4' },
    core:     { th: 'ลิฟต์ / บันได',    color: '#dfe3ec' },
  },
  colors: { plate: '#f6f9fa', corridor: '#ffffff', wall: '#ffffff', ground: '#dbe7e3', route: '#0e93a8', start: '#2563eb', dest: '#d63d74', exit: '#15803d', fire: '#c62828' },
};
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ===== 2. MAP DATA (placeholder) =====
/*
 * MAP JSON SCHEMA (metres; +x = east, +z = south; each floor uses the same x/z frame)
 * {
 *   floors:    [ { id:'F1', nameTh:'ชั้น 1', x0, x1, z0, z1 } ],
 *   corridors: [ { floor, a:[x,z], b:[x,z] } ]            // walkable centre-lines; segments must meet at shared end points
 *   rooms:     [ { id, floor, nameTh, nameEn, cat, x0, x1, z0, z1, door:'N'|'S'|'E'|'W', kw:'search keywords', link? } ]
 *              // the door sits at the middle of that side and is joined to the nearest corridor automatically
 *              // link: rooms on different floors sharing a link id are joined vertically ('lift' | 'stairs' via kind)
 *   links:     [ { id:'L1', kind:'lift'|'stairs', nameTh } ]
 *   points:    [ { id, floor, kind:'exit'|'kiosk'|'firestairs', x, z, nameTh, link? } ]
 * }
 * Replace buildPlaceholderMap() with a CAD-derived JSON (or load ?map=url) — no rendering code changes needed.
 */
function buildPlaceholderMap() {
  const M = { floors: [], corridors: [], rooms: [], links: [], points: [] };
  M.floors.push({ id: 'F1', nameTh: 'ชั้น 1', short: '1', x0: -42, x1: 42, z0: -24, z1: 30 });
  M.floors.push({ id: 'F2', nameTh: 'ชั้น 2', short: '2', x0: -42, x1: 42, z0: -24, z1: 26 });
  const X = [-24, 0, 24], Z = [-22, 0, 22];
  for (const f of ['F1', 'F2']) {
    const end = f === 'F1' ? 42 : 40;
    for (const z of Z) for (let i = 0; i < 2; i++) M.corridors.push({ floor: f, a: [X[i], z], b: [X[i + 1], z] });
    for (const x of X) for (let i = 0; i < 2; i++) M.corridors.push({ floor: f, a: [x, Z[i]], b: [x, Z[i + 1]] });
    M.corridors.push({ floor: f, a: [-end, 0], b: [-24, 0] }, { floor: f, a: [24, 0], b: [end, 0] });
  }
  M.corridors.push({ floor: 'F1', a: [0, -24], b: [0, -22] }, { floor: 'F1', a: [0, 22], b: [0, 30] });
  M.links.push({ id: 'L1', kind: 'lift', nameTh: 'ลิฟต์ L1' }, { id: 'L2', kind: 'lift', nameTh: 'ลิฟต์ L2' }, { id: 'S1', kind: 'stairs', nameTh: 'บันได S1' },
    { id: 'FW', kind: 'stairs', nameTh: 'บันไดหนีไฟฝั่งตะวันตก' }, { id: 'FE', kind: 'stairs', nameTh: 'บันไดหนีไฟฝั่งตะวันออก' });
  const R = (floor, id, nameTh, nameEn, cat, x0, x1, z0, z1, door, kw = '', link) => M.rooms.push({ id: `${floor}-${id}`, floor, nameTh, nameEn, cat, x0, x1, z0, z1, door, kw, link });
  const core = f => {   // lift / stairs / toilet cores repeat on every floor
    R(f, 'L1', 'ลิฟต์ L1', 'Lift L1', 'core', -7.5, -1.5, -6.5, -1.5, 'S', 'ลิฟท์ lift elevator', 'L1');
    R(f, 'S1', 'บันได S1', 'Stairs S1', 'core', -7.5, -1.5, -13, -7.5, 'E', 'บันได stairs', 'S1');
    R(f, 'WC1', 'ห้องน้ำ (ชาย / หญิง / ผู้พิการ)', 'Restrooms', 'facility', -7.5, -1.5, -20.5, -14, 'E', 'ห้องน้ำ สุขา ห้องสุขา toilet restroom wc');
    R(f, 'L2', 'ลิฟต์ L2', 'Lift L2', 'core', 15.5, 22.5, 1.5, 7, 'N', 'ลิฟท์ lift elevator', 'L2');
    R(f, 'WC2', 'ห้องน้ำ (ชาย / หญิง / ผู้พิการ)', 'Restrooms', 'facility', 15.5, 22.5, 8, 20.5, 'E', 'ห้องน้ำ สุขา ห้องสุขา toilet restroom wc');
  };
  // ---- floor 1 ----
  core('F1');
  R('F1', 'HEART', 'ศูนย์หัวใจ', 'Heart Center', 'clinic', -22.5, -8.5, -20.5, -1.5, 'S', 'หัวใจ heart cardio คลื่นหัวใจ ekg echo');
  R('F1', 'LAB', 'ห้องปฏิบัติการ (เจาะเลือด)', 'Laboratory', 'service', 1.5, 11.5, -20.5, -1.5, 'S', 'แล็บ lab เจาะเลือด ตรวจเลือด ปัสสาวะ');
  R('F1', 'XRAY', 'รังสีวินิจฉัย (X-ray / CT)', 'Radiology', 'service', 12.5, 22.5, -20.5, -1.5, 'S', 'เอกซเรย์ xray x-ray ct mri รังสี');
  R('F1', 'REC', 'เวชระเบียน / ทำบัตรผู้ป่วยใหม่', 'Medical Records', 'service', -22.5, -12.5, 1.5, 20.5, 'N', 'ทำบัตร บัตรใหม่ ลงทะเบียน ผู้ป่วยใหม่ เวชระเบียน register');
  R('F1', 'CASH', 'การเงิน (ชำระเงิน)', 'Cashier', 'service', -11.5, -1.5, 1.5, 10.5, 'N', 'จ่ายเงิน ชำระเงิน การเงิน cashier payment');
  R('F1', 'PRAY', 'ห้องละหมาด', 'Prayer Room', 'facility', -11.5, -1.5, 11.5, 20.5, 'E', 'ละหมาด prayer มุสลิม');
  R('F1', 'PHARM', 'ห้องยา (รับยา)', 'Pharmacy', 'service', 1.5, 14.5, 1.5, 20.5, 'N', 'รับยา ยา เภสัช pharmacy ห้องยา');

    view.fit({ x0: Math.min(...xs) - 6, x1: Math.max(...xs) + 6, z0: Math.min(...zs) - 6, z1: Math.max(...zs) + 6 });
  }
  bumpIdle();
}

// kiosk mode
function bumpIdle() { if (!S.kiosk) return; clearTimeout(bumpIdle.h); bumpIdle.h = setTimeout(() => { $('#clear').click(); $('#q').value = ''; renderResults(); setStartKiosk(S.kiosk); }, CONFIG.idleResetSec * 1000); }
if (S.kiosk) {
  document.body.classList.add('kiosk-mode'); $('#startBox').hidden = true;
  const k = kiosks.find(x => x.id === S.kiosk); $('#kioskHere').hidden = false; $('#kioskHere').textContent = `คุณอยู่ที่: ${k.nameTh} (${G.floors.get(k.floor).nameTh})`;
  ['pointerdown', 'keydown'].forEach(ev => addEventListener(ev, bumpIdle));
}
setStartKiosk(S.kiosk || 'K1');
renderResults();
view.fitFloor(view.floor, false);
window.__map = { G, S, view, goTo, goSOS, route };
</script>
